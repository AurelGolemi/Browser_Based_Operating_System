<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drive OS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="desktop">
    <div class="grid-os">
      <img src="/Img/computer.png" alt="This PC" class="icon">
        <p>This PC</p>
    </div>
    <div class="grid-os">
      <img src="/Img/folder.png" alt="File Explorer" class="icon">
        <p>File Explorer</p>
    </div>
    <div class="grid-os">
      <img src="/Img/notes.png" alt="Notes" class="icon">
        <p>Notes</p>
    </div>
    <div class="grid-os">
      <img src="/Img/settings.png" alt="Settings" class="icon">
        <p>Settings</p>
    </div>
    <div class="grid-os">
      <img src="/Img/music.png" alt="Music" class="icon">
        <p>Music</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
